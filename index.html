function todayISO() { return new Date().toISOString().slice(0, 10); }
function dayIndex() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  return Math.floor((now - start) / 86400000);
}
function verseOfDay() { return VERSES[dayIndex() % VERSES.length]; }
function formatDate(d) { if (!d) return ""; return new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }); }
function shuffled(arr) { return [...arr].sort(() => Math.random() - 0.5); }

/* ---------- Auth ---------- */

function Root() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);
  if (session === undefined) {
    return <div style={{ backgroundColor: BG, color: TEXT, minHeight: "100vh", fontFamily: "'IBM Plex Sans', sans-serif" }} className="flex items-center justify-center"><p className="text-sm opacity-70">Connexion…</p></div>;
  }
  if (!session) return <AuthScreen />;
  return <App key={session.user.id} session={session} />;
}

function AuthScreen() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setError(""); setInfo(""); setLoading(true);
    try {
      if (mode === "signup") {
        const { error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        setInfo("Compte créé. Si une confirmation par email est demandée, vérifie ta boîte mail, puis connecte-toi.");
        setMode("signin");
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (e) {
      setError(e.message || "Une erreur est survenue.");
    } finally { setLoading(false); }
  };

  return (
    <div style={{ background: GRADIENT, minHeight: "100vh", fontFamily: "'IBM Plex Sans', sans-serif" }} className="flex flex-col justify-center px-6">
      <div className="max-w-sm w-full mx-auto rounded-2xl p-6" style={{ backgroundColor: SURFACE, border: `1px solid ${BORDER}` }}>
        <p className="text-xs tracking-[0.2em] uppercase mb-2 text-center" style={{ color: LAV }}><i className="fa-solid fa-cross mr-1.5" />Verset du jour</p>
        <h1 style={{ fontFamily: "'Fraunces', serif", color: TEXT }} className="text-2xl text-center mb-6">{mode === "signup" ? "Créer ton compte" : "Bon retour"}</h1>
        <Field label="Email"><input type="email" className={inputClass} style={inputStyle} value={email} onChange={(e) => setEmail(e.target.value)} placeholder="toi@exemple.com" /></Field>
        <Field label="Mot de passe"><input type="password" className={inputClass} style={inputStyle} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" /></Field>
        {error && <p className="text-xs mb-3" style={{ color: DANGER }}>{error}</p>}
        {info && <p className="text-xs mb-3" style={{ color: SAGE }}>{info}</p>}
        <button disabled={loading || !email || !password} onClick={submit} className="w-full py-3 rounded-lg font-medium text-sm disabled:opacity-40 mb-3" style={{ backgroundColor: LAV, color: "#FFFFFF" }}>
          {loading ? "…" : mode === "signup" ? "Créer mon compte" : "Se connecter"}
        </button>
        <button onClick={() => { setMode(mode === "signup" ? "signin" : "signup"); setError(""); setInfo(""); }} className="w-full text-center text-xs" style={{ color: TEXT_MUTED }}>
          {mode === "signup" ? "J'ai déjà un compte" : "Pas encore de compte ? En créer un"}
        </button>
      </div>
    </div>
  );
}

/* ---------- App ---------- */

function App({ session }) {
  const [tab, setTab] = useState("home");
  const [saved, setSaved] = useState([]);
  const [checkins, setCheckins] = useState([]);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState("");
  const [verseIdx, setVerseIdx] = useState(dayIndex() % VERSES.length);

  const fetchAll = async () => {
    const [v, c] = await Promise.all([
      sb.from("saved_verses").select("*").eq("user_id", session.user.id).order("saved_at", { ascending: false }),
      sb.from("daily_checkins").select("*").eq("user_id", session.user.id).order("day", { ascending: false }).limit(60),
    ]);
    if (!v.error) setSaved(v.data || []);
    if (!c.error) setCheckins(c.data || []);
    setReady(true);
  };
  useEffect(() => { fetchAll(); }, [session.user.id]);

  // marque le jour comme actif à l'ouverture
  useEffect(() => {
    (async () => {
      const day = todayISO();
      await sb.from("daily_checkins").upsert({ user_id: session.user.id, day }, { onConflict: "user_id,day", ignoreDuplicates: true });
    })();
  }, [session.user.id]);

  const bumpReadCount = async () => {
    const day = todayISO();
    const existing = checkins.find((c) => c.day === day);
    const n = (existing?.verses_read || 0) + 1;
    const { error } = await sb.from("daily_checkins").upsert({ user_id: session.user.id, day, verses_read: n, quiz_done: existing?.quiz_done || false });
    if (!error) fetchAll();
  };

  const markQuizDone = async () => {
    const day = todayISO();
    const existing = checkins.find((c) => c.day === day);
    await sb.from("daily_checkins").upsert({ user_id: session.user.id, day, verses_read: existing?.verses_read || 0, quiz_done: true });
    fetchAll();
  };

  const saveQuizResult = async (score, total) => {
    const { error } = await sb.from("quiz_results").insert({ user_id: session.user.id, day: todayISO(), score, total });
    if (error) setError(error.message);
    markQuizDone();
  };

  const isSaved = (ref) => saved.some((s) => s.reference === ref);
  const toggleSave = async (verse) => {
    setError("");
    const existing = saved.find((s) => s.reference === verse.ref);
    if (existing) {
      const { error } = await sb.from("saved_verses").delete().eq("id", existing.id);
      if (error) setError(error.message);
    } else {
      const { error } = await sb.from("saved_verses").insert({ user_id: session.user.id, reference: verse.ref, text: verse.text });
      if (error) setError(error.message);
    }
    fetchAll();
  };
  const deleteSaved = async (id) => { const { error } = await sb.from("saved_verses").delete().eq("id", id); if (error) setError(error.message); fetchAll(); };

  // streak = jours consécutifs jusqu'à aujourd'hui
  const streak = useMemo(() => {
    const days = new Set(checkins.map((c) => c.day));
    let n = 0;
    const d = new Date();
    while (days.has(d.toISOString().slice(0, 10))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }, [checkins]);

  const logout = () => sb.auth.signOut();

  if (!ready) {
    return <div style={{ backgroundColor: BG, color: TEXT, minHeight: "100vh", fontFamily: "'IBM Plex Sans', sans-serif" }} className="flex items-center justify-center"><p className="text-sm opacity-70">Chargement…</p></div>;
  }

  return (
    <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", backgroundColor: BG, color: TEXT, minHeight: "100vh", paddingBottom: "calc(84px + env(safe-area-inset-bottom))" }}>
      <main>
        {tab === "home" && (
          <Home
            streak={streak} checkins={checkins}
            verseIdx={verseIdx} setVerseIdx={(i) => { setVerseIdx(i); bumpReadCount(); }}
            isSaved={isSaved} onToggleSave={toggleSave} onLogout={logout} error={error}
          />
        )}
        {tab === "read" && <Reader />}
        {tab === "quiz" && <Quiz onFinish={saveQuizResult} />}
        {tab === "verses" && <MyVerses saved={saved} onDelete={deleteSaved} />}
      </main>

      <nav style={{ position: "fixed", left: 0, right: 0, bottom: 0, backgroundColor: SURFACE, borderTop: `1px solid ${BORDER}`, paddingBottom: "env(safe-area-inset-bottom)" }} className="flex">
        <TabButton active={tab === "home"} onClick={() => setTab("home")} icon="fa-house" label="Accueil" />
        <TabButton active={tab === "read"} onClick={() => setTab("read")} icon="fa-book-bible" label="Lire" />
        <TabButton active={tab === "quiz"} onClick={() => setTab("quiz")} icon="fa-star" label="Quiz" />
        <TabButton active={tab === "verses"} onClick={() => setTab("verses")} icon="fa-bookmark" label="Mes versets" />
      </nav>
    </div>
  );
}

function TabButton({ active, onClick, icon, label }) {
  return (
    <button onClick={onClick} className="flex-1 flex flex-col items-center gap-1 py-3" style={{ color: active ? LAV_DEEP : TEXT_MUTED }}>
      <i className={`fa-solid ${icon}`} style={{ fontSize: 18, opacity: active ? 1 : 0.65 }} />
      <span className="text-[9.5px] tracking-wide text-center leading-none" style={{ fontWeight: active ? 600 : 400 }}>{label}</span>
    </button>
  );
}

/* ---------- Accueil : verset du jour + habitudes ---------- */

function Home({ streak, checkins, verseIdx, setVerseIdx, isSaved, onToggleSave, onLogout, error }) {
  const verse = VERSES[verseIdx % VERSES.length];
  const today = new Date();
  // semaine courante L..D
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const weekDays = Array.from({ length: 7 }).map((_, i) => {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const iso = d.toISOString().slice(0, 10);
    return { label: "LMMJVSD"[i], iso, active: checkins.some((c) => c.day === iso), isToday: iso === todayISO() };
  });
  const todayCheck = checkins.find((c) => c.day === todayISO());
  const progress = Math.min(100, ((todayCheck?.verses_read ? 50 : 0) + (todayCheck?.quiz_done ? 50 : 0)));

  const share = async () => {
    const msg = `« ${verse.text} »\n— ${verse.ref}`;
    if (navigator.share) { try { await navigator.share({ text: msg }); } catch (e) {} }
    else { try { await navigator.clipboard.writeText(msg); alert("Verset copié !"); } catch (e) {} }
  };

  return (
    <div>
      {/* Bandeau lavande avec le verset du jour */}
      <div style={{ background: GRADIENT, paddingTop: "calc(2rem + env(safe-area-inset-top))" }} className="px-5 pb-8 rounded-b-3xl">
        <div className="flex items-center justify-between mb-6">
          <div className="flex items-center gap-2">
            <span className="w-9 h-9 rounded-full flex items-center justify-center text-sm" style={{ backgroundColor: "rgba(255,255,255,0.25)", color: "#fff" }}><i className="fa-solid fa-fire" /></span>
            <div>
              <p className="text-[11px]" style={{ color: "rgba(255,255,255,0.8)" }}>Série en cours</p>
              <p className="text-sm font-semibold text-white">{streak} jour{streak > 1 ? "s" : ""}</p>
            </div>
          </div>
          <button onClick={onLogout} className="text-[10px] underline" style={{ color: "rgba(255,255,255,0.8)" }}><i className="fa-solid fa-right-from-bracket mr-1" />Déconnexion</button>
        </div>
        <p className="text-[11px] uppercase tracking-[0.2em] text-center mb-3" style={{ color: "rgba(255,255,255,0.85)" }}>Verset du jour · {verse.theme}</p>
        <p style={{ fontFamily: "'Fraunces', serif" }} className="text-2xl leading-snug text-center text-white px-2">
          {verse.text}
        </p>
        <p className="text-center text-sm mt-4" style={{ color: "rgba(255,255,255,0.9)" }}>— {verse.ref}</p>

        <div className="flex justify-center gap-3 mt-6">
          <button onClick={() => setVerseIdx((verseIdx + VERSES.length - 1) % VERSES.length)} className="w-10 h-10 rounded-full" style={{ backgroundColor: "rgba(255,255,255,0.22)", color: "#fff" }} aria-label="Verset précédent"><i className="fa-solid fa-chevron-left" /></button>
          <button onClick={() => onToggleSave(verse)} className="px-4 h-10 rounded-full text-sm font-medium" style={{ backgroundColor: "#FFFFFF", color: LAV_DEEP }}>
            <i className={`${isSaved(verse.ref) ? "fa-solid" : "fa-regular"} fa-bookmark mr-1.5`} />{isSaved(verse.ref) ? "Enregistré" : "Garder"}
          </button>
          <button onClick={share} className="px-4 h-10 rounded-full text-sm" style={{ backgroundColor: "rgba(255,255,255,0.22)", color: "#fff" }}><i className="fa-solid fa-share-nodes mr-1.5" />Partager</button>
          <button onClick={() => setVerseIdx((verseIdx + 1) % VERSES.length)} className="w-10 h-10 rounded-full" style={{ backgroundColor: "rgba(255,255,255,0.22)", color: "#fff" }} aria-label="Verset suivant"><i className="fa-solid fa-chevron-right" /></button>
        </div>
      </div>

      {error && <div className="mx-5 mt-4 text-xs px-3 py-2 rounded" style={{ backgroundColor: DANGER + "1A", border: `1px solid ${DANGER}`, color: TEXT }}>{error}</div>}

      {/* Carte habitudes, comme la capture "Today's Journey" */}
      <div className="px-5 mt-5 space-y-5">
        <div className="rounded-2xl border p-5" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
          <div className="flex items-center justify-between mb-1">
            <p className="text-sm font-semibold">Ton parcours du jour</p>
            <span className="text-xs" style={{ color: GOLD }}><i className="fa-solid fa-fire mr-1" />{streak}</span>
          </div>
          <p className="text-[11px] mb-4" style={{ color: TEXT_MUTED }}>Disciple fidèle</p>
          <div className="flex justify-between mb-4">
            {weekDays.map((d, i) => (
              <div key={i} className="flex flex-col items-center gap-1.5">
                <span className="text-[10px]" style={{ color: TEXT_MUTED }}>{d.label}</span>
                <div className="w-8 h-8 rounded-full flex items-center justify-center text-xs border"
                  style={{
                    backgroundColor: d.active ? (d.isToday ? GOLD + "26" : SURFACE_ALT) : "transparent",
                    borderColor: d.active ? (d.isToday ? GOLD : LAV_PALE) : BORDER,
                  }}>
                  {d.active ? <i className="fa-solid fa-fire" style={{ color: d.isToday ? GOLD : LAV }} /> : ""}

            ))}
          </div>
          <div className="flex items-center justify-between text-[11px] mb-1.5">

        <div className="rounded-2xl p-4 flex gap-3" style={{ backgroundColor: SURFACE_ALT, border: `1px solid ${BORDER}` }}>
          <i className="fa-solid fa-hands-praying" style={{ fontSize: 18, color: LAV }} />
          <p className="text-xs leading-relaxed" style={{ color: TEXT }}>
            Prends un instant pour relire le verset lentement, puis une courte prière avec tes propres mots. La régularité compte plus que la durée.

}

/* ---------- Lecture de la Bible ---------- */

function Reader() {
  const [book, setBook] = useState(42); // Jean (index 0-based : 42 = Jean)
  const [chapter, setChapter] = useState(1);
  const [verses, setVerses] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const load = async (b = book, ch = chapter) => {
    setLoading(true); setError(""); setVerses(null);
    try {
      const res = await fetch(`https://api.getbible.net/v2/ls1910/${b + 1}/${ch}.json`);
      if (!res.ok) throw new Error("Chapitre introuvable");
      const data = await res.json();
      setVerses(data.verses || []);
    } catch (e) {
      setError("Impossible de charger ce chapitre. Vérifie ta connexion, ou réessaie.");
    } finally { setLoading(false); }
  };
  useEffect(() => { load(); }, []);

  return (
    <div>
      <header className="px-5 pb-4" style={{ borderBottom: `1px solid ${BORDER}`, paddingTop: "calc(2rem + env(safe-area-inset-top))" }}>
        <p className="text-xs tracking-[0.2em] uppercase" style={{ color: LAV }}>Lecture</p>
        <h1 style={{ fontFamily: "'Fraunces', serif" }} className="text-2xl mt-1">La Bible <span className="text-sm font-normal" style={{ color: TEXT_MUTED }}>(Louis Segond 1910)</span></h1>
        <div className="flex gap-2 mt-3">
          <select value={book} onChange={(e) => { const b = Number(e.target.value); setBook(b); setChapter(1); load(b, 1); }} className={inputClass} style={{ ...inputStyle, flex: 2 }}>
            {BOOKS.map((b, i) => <option key={i} value={i}>{b}</option>)}
          </select>
          <input type="number" min="1" value={chapter} onChange={(e) => setChapter(Math.max(1, Number(e.target.value)))} className={inputClass} style={{ ...inputStyle, flex: 1 }} />
          <button onClick={() => load()} className="px-4 rounded-lg text-sm font-medium" style={{ backgroundColor: LAV, color: "#fff" }}>Lire</button>
        </div>
      </header>

      <div className="px-5 mt-4 pb-6">
        {loading && <p className="text-sm text-center py-10" style={{ color: TEXT_MUTED }}>Chargement…</p>}
        {error && <p className="text-sm text-center py-10" style={{ color: DANGER }}>{error}</p>}
        {verses && (
          <div className="rounded-2xl border p-5" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
            <p style={{ fontFamily: "'Fraunces', serif" }} className="text-lg mb-4">{BOOKS[book]} {chapter}</p>
            <div className="space-y-3">
              {verses.map((v) => (
                <p key={v.verse} className="text-[15px] leading-relaxed">
                  <span className="text-xs mr-2" style={{ color: GOLD, fontFamily: "'IBM Plex Mono', monospace" }}>{v.verse}</span>
                  {v.text}
                </p>
              ))}
            </div>
            <div className="flex justify-between mt-6">
              <button disabled={chapter <= 1} onClick={() => { const c = chapter - 1; setChapter(c); load(book, c); }} className="text-sm px-4 py-2 rounded-lg border disabled:opacity-30" style={{ borderColor: BORDER, color: TEXT }}>‹ Précédent</button>
              <button disabled={chapter >= CHAPTERS[book]} onClick={() => { const c = chapter + 1; setChapter(c); load(book, c); }} className="text-sm px-4 py-2 rounded-lg disabled:opacity-30" style={{ backgroundColor: LAV, color: "#fff" }}>Suivant ›</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- Quiz ---------- */

const QUIZ_THEMES = [
  { id: "mix", label: "Tout mélangé", icon: "fa-shuffle", desc: "Un peu de tout, avec des versets réels" },
  { id: "at", label: "Ancien Testament", icon: "fa-scroll", desc: "De la Genèse à Malachie" },
  { id: "nt", label: "Nouveau Testament", icon: "fa-dove", desc: "Jésus, les apôtres, l'Église" },
  { id: "cit", label: "Citations", icon: "fa-quote-left", desc: "Qui l'a dit ? Où est-ce écrit ?" },
  { id: "livres", label: "Livres de la Bible", icon: "fa-layer-group", desc: "Ordre, testaments, généralités" },
  { id: "online", label: "Versets au hasard", icon: "fa-globe", desc: "Tirés de toute la Bible (internet)" },
];

const STATS_KEY = "vdj-quiz-stats-v1";
function loadStats() { try { return JSON.parse(localStorage.getItem(STATS_KEY)) || {}; } catch (e) { return {}; } }
function saveStats(s) { try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch (e) {} }

const rand = (n) => Math.floor(Math.random() * n);
const pickOne = (arr) => arr[rand(arr.length)];
const cleanText = (t) => (t || "").replace(/[  \s]+/g, " ").replace(/’/g, "'").trim();
const NT_START = 39; // index de Matthieu dans BOOKS

function makeQ(key, cat, q, correct, wrongs, ref, quote) {
  const opts = shuffled([correct, ...wrongs.slice(0, 3)]);
  return { key, cat, q, quote, opts, ans: opts.indexOf(correct), ref };
}
function staticQ(item) { return makeQ("s:" + item[1], item[0], item[1], item[2][0], item[2].slice(1), item[3]); }

// choisit n éléments, en favorisant les questions jamais vues et celles ratées la dernière fois
function weightedPick(items, n, stats) {
  const pool = items.map((it) => {
    const s = stats[it.key];
    return { it, w: !s ? 3 : s.last === 0 ? 4 : 1 };
  });
  const out = [];
  while (out.length < n && pool.length) {
    const total = pool.reduce((a, p) => a + p.w, 0);
    let r = Math.random() * total, i = 0;
    while (r > pool[i].w) { r -= pool[i].w; i++; }
    out.push(pool[i].it); pool.splice(i, 1);
  }
  return out;
}

// distracteurs : livres différents, de préférence du même testament
function otherBooks(b, n = 3) {
  const sameT = BOOKS.map((_, i) => i).filter((i) => i !== b && (i >= NT_START) === (b >= NT_START));
  const res = new Set();
  while (res.size < n) res.add(BOOKS[res.size < 2 ? pickOne(sameT) : rand(BOOKS.length)]);
  res.delete(BOOKS[b]);
  while (res.size < n) { const x = BOOKS[rand(BOOKS.length)]; if (x !== BOOKS[b]) res.add(x); }
  return [...res];
}

// "complète le verset" : masque un mot significatif
function blankQuestion(key, cat, text, ref, otherTexts) {
  const words = (text.match(/[A-Za-zÀ-ÖØ-öø-ÿœŒ]{6,}/g) || []);
  if (!words.length) return null;
  const answer = pickOne(words);
  const pool = new Set();
  otherTexts.forEach((t) => (t.match(/[A-Za-zÀ-ÖØ-öø-ÿœŒ]{6,}/g) || []).forEach((w) => pool.add(w)));
  const lowAns = answer.toLowerCase();
  const cands = [...pool].filter((w) => w.toLowerCase() !== lowAns && !text.toLowerCase().includes(w.toLowerCase()));
  if (cands.length < 3) return null;
  const wrongs = new Set();
  while (wrongs.size < 3) wrongs.add(pickOne(cands));
  const quote = text.replace(answer, "_____");
  return makeQ(key, cat, "Quel mot manque dans ce verset ?", answer, [...wrongs], ref, quote);
}

// ---- générateurs locaux (variété quasi infinie) ----
function genBookAfter() {
  const i = rand(BOOKS.length - 1);
  const correct = BOOKS[i + 1];
  const near = [i - 1, i + 2, i + 3, i - 2].filter((k) => k >= 0 && k < BOOKS.length && k !== i && k !== i + 1).map((k) => BOOKS[k]);
  const wrongs = shuffled(near).slice(0, 3);
  while (wrongs.length < 3) { const x = BOOKS[rand(BOOKS.length)]; if (x !== correct && x !== BOOKS[i] && !wrongs.includes(x)) wrongs.push(x); }
  return makeQ("g:after:" + i, "livres", `Dans l'ordre de la Bible, quel livre vient juste après « ${BOOKS[i]} » ?`, correct, wrongs, "Ordre des livres de la Bible");
}
function genBookBefore() {
  const i = 1 + rand(BOOKS.length - 1);
  const correct = BOOKS[i - 1];
  const near = [i + 1, i - 2, i - 3, i + 2].filter((k) => k >= 0 && k < BOOKS.length && k !== i && k !== i - 1).map((k) => BOOKS[k]);
  const wrongs = shuffled(near).slice(0, 3);
  while (wrongs.length < 3) { const x = BOOKS[rand(BOOKS.length)]; if (x !== correct && x !== BOOKS[i] && !wrongs.includes(x)) wrongs.push(x); }
  return makeQ("g:before:" + i, "livres", `Dans l'ordre de la Bible, quel livre vient juste avant « ${BOOKS[i]} » ?`, correct, wrongs, "Ordre des livres de la Bible");
}
function genTestament() {
  const nt = Math.random() < 0.5;
  const inT = (i) => (i >= NT_START) === nt;
  const correct = BOOKS[pickOne(BOOKS.map((_, i) => i).filter(inT))];
  const wrongs = shuffled(BOOKS.filter((_, i) => !inT(i))).slice(0, 3);
  return makeQ("g:test:" + correct, "livres", `Lequel de ces livres fait partie ${nt ? "du Nouveau" : "de l'Ancien"} Testament ?`, correct, wrongs, nt ? "Nouveau Testament (Matthieu → Apocalypse)" : "Ancien Testament (Genèse → Malachie)");
}
function genChapters() {
  const b = rand(BOOKS.length);
  const n = CHAPTERS[b];
  const wrongs = new Set();
  while (wrongs.size < 3) { const d = (rand(2) ? 1 : -1) * (1 + rand(Math.max(3, Math.round(n * 0.4)))); const w = n + d; if (w > 0 && w !== n) wrongs.add(w); }
  return makeQ("g:chap:" + b, "livres", `Combien de chapitres compte le livre « ${BOOKS[b]} » ?`, String(n), [...wrongs].map(String), BOOKS[b]);
}
function genVerseRef() {
  const v = pickOne(VERSES);
  const wrongs = shuffled(VERSES.filter((x) => x.ref !== v.ref)).slice(0, 3).map((x) => x.ref);
  return makeQ("g:ref:" + v.ref, "cit", "D'où vient ce verset ?", v.ref, wrongs, v.ref, v.text);
}
function genVerseBlank() {
  const v = pickOne(VERSES);
  return blankQuestion("g:blank:" + v.ref, "cit", v.text, v.ref, VERSES.filter((x) => x !== v).map((x) => x.text));
}
const LOCAL_GENS = { livres: [genBookAfter, genBookBefore, genTestament, genChapters], cit: [genVerseRef, genVerseBlank] };

// ---- questions à partir d'un vrai chapitre de la Bible (API getBible) ----
async function genOnline() {
  const b = rand(BOOKS.length);
  const ch = 1 + rand(CHAPTERS[b]);
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 7000);
  try {
    const res = await fetch(`https://api.getbible.net/v2/ls1910/${b + 1}/${ch}.json`, { signal: ctrl.signal });
    if (!res.ok) return null;
    const data = await res.json();
    const verses = (data.verses || []).map((v) => ({ n: v.verse, text: cleanText(v.text) }));
    const good = verses.filter((v) => v.text.length >= 50 && v.text.length <= 230);
    if (!good.length) return null;
    const v = pickOne(good);
    const ref = `${BOOKS[b]} ${ch}:${v.n}`;
    if (Math.random() < 0.5) {
      return makeQ("o:book:" + ref, "online", "De quel livre est tiré ce verset ?", BOOKS[b], otherBooks(b), ref, v.text);
    }
    const others = verses.filter((x) => x !== v).map((x) => x.text).concat(VERSES.map((x) => x.text));
    return blankQuestion("o:blank:" + ref, "online", v.text, ref, others)
      || makeQ("o:book:" + ref, "online", "De quel livre est tiré ce verset ?", BOOKS[b], otherBooks(b), ref, v.text);
  } catch (e) { return null; } finally { clearTimeout(timer); }
}

function uniqueFill(list, n, makeFn, tries = 60) {
  const keys = new Set(list.map((q) => q.key));
  while (list.length < n && tries-- > 0) {
    const q = makeFn();
    if (q && !keys.has(q.key)) { keys.add(q.key); list.push(q); }
  }
  return list;
}

async function buildQuiz(theme, count, stats) {
  const allStatic = QUIZ_BANK.map(staticQ);
  const anyLocalGen = () => pickOne([...LOCAL_GENS.livres, ...LOCAL_GENS.cit])();
  let qs = [];

  if (theme === "review") {
    const wrong = allStatic.filter((q) => stats[q.key] && stats[q.key].last === 0);
    return shuffled(wrong).slice(0, count);
  }
  if (theme === "online") {
    const got = (await Promise.all(Array.from({ length: count }, genOnline))).filter(Boolean);
    qs = uniqueFill(got, count, anyLocalGen);
    return shuffled(qs);
  }
  if (theme === "mix") {
    const nOnline = Math.round(count * 0.2);
    const nGen = Math.round(count * 0.2);
    const onlinePromise = Promise.all(Array.from({ length: nOnline }, genOnline));
    qs = weightedPick(allStatic, count - nOnline - nGen, stats);
    uniqueFill(qs, qs.length + nGen, anyLocalGen);
    qs.push(...(await onlinePromise).filter(Boolean));
    uniqueFill(qs, count, () => pickOne(allStatic.filter((q) => !qs.some((x) => x.key === q.key))));
    return shuffled(qs);
  }
  // thème précis : questions de la banque + questions générées du même thème
  const bank = allStatic.filter((q) => q.cat === theme);
  const gens = LOCAL_GENS[theme] || [];
  const nGen = gens.length ? Math.max(Math.round(count * (theme === "livres" ? 0.6 : 0.3)), count - bank.length) : 0;
  qs = weightedPick(bank, count - nGen, stats);
  if (gens.length) uniqueFill(qs, count, () => pickOne(gens)());
  return shuffled(qs);
}

function Quiz({ onFinish }) {
  const [phase, setPhase] = useState("setup"); // setup | loading | play | done
  const [theme, setTheme] = useState("mix");
  const [count, setCount] = useState(10);
  const [stats, setStats] = useState(loadStats);
  const [questions, setQuestions] = useState([]);
  const [idx, setIdx] = useState(0);
  const [score, setScore] = useState(0);
  const [picked, setPicked] = useState(null);
  const [mistakes, setMistakes] = useState([]);

  const reviewCount = useMemo(() => QUIZ_BANK.filter((it) => { const s = stats["s:" + it[1]]; return s && s.last === 0; }).length, [stats]);
  const seenCount = useMemo(() => Object.keys(stats).length, [stats]);

  const start = async (th = theme) => {
    setTheme(th); setPhase("loading");
    const qs = await buildQuiz(th, count, stats);
    if (!qs.length) { setPhase("setup"); return; }
    setQuestions(qs); setIdx(0); setScore(0); setPicked(null); setMistakes([]); setPhase("play");
  };

  const q = questions[idx];

  const pick = (i) => {
    if (picked !== null) return;
    setPicked(i);
    const ok = i === q.ans;
    if (ok) setScore((s) => s + 1);
    else setMistakes((m) => [...m, q]);
    setStats((prev) => {
      const s = prev[q.key] || { n: 0, w: 0 };
      const next = { ...prev, [q.key]: { n: s.n + 1, w: s.w + (ok ? 0 : 1), last: ok ? 1 : 0 } };
      saveStats(next);
      return next;
    });
  };
  const next = () => {
    if (idx + 1 >= questions.length) { setPhase("done"); onFinish(score, questions.length); }
    else { setIdx(idx + 1); setPicked(null); }
  };

  const header = (
    <header className="px-5 pb-4" style={{ borderBottom: `1px solid ${BORDER}`, paddingTop: "calc(2rem + env(safe-area-inset-top))" }}>
      <div className="flex items-center justify-between">
        <p className="text-xs tracking-[0.2em] uppercase" style={{ color: LAV }}>Quiz biblique</p>
        {phase === "play" && <p className="text-xs" style={{ color: GOLD }}><i className="fa-solid fa-star mr-1" />{score}</p>}
        {phase === "play" && <button onClick={() => setPhase("setup")} className="text-[11px]" style={{ color: TEXT_MUTED }}><i className="fa-solid fa-xmark mr-1" />Quitter</button>}
      </div>
      {phase === "play" ? (
        <>
          <p className="text-[11px] mt-2" style={{ color: TEXT_MUTED }}>Question {idx + 1}/{questions.length}</p>
          <div className="h-1.5 rounded-full overflow-hidden mt-2" style={{ backgroundColor: SURFACE_ALT }}>
            <div className="h-full rounded-full transition-all" style={{ width: `${(idx / questions.length) * 100}%`, backgroundColor: GOLD }} />
          </div>
        </>
      ) : (
        <h1 style={{ fontFamily: "'Fraunces', serif" }} className="text-2xl mt-1">Entraîne-toi</h1>
      )}
    </header>
  );

  if (phase === "setup" || phase === "loading") {
    return (
      <div>
        {header}
        <div className="px-5 mt-4 pb-6 space-y-4">
          <div className="flex gap-3">
            <div className="flex-1 rounded-xl border p-3" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
              <p className="text-lg font-semibold" style={{ color: LAV_DEEP }}>{QUIZ_BANK.length}+</p>
              <p className="text-[11px]" style={{ color: TEXT_MUTED }}>questions, plus des milliers générées à partir des versets</p>
            </div>
            <div className="flex-1 rounded-xl border p-3" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
              <p className="text-lg font-semibold" style={{ color: GOLD }}>{seenCount}</p>
              <p className="text-[11px]" style={{ color: TEXT_MUTED }}>questions déjà rencontrées</p>
            </div>
          </div>

          <div>
            <p className="text-[11px] uppercase tracking-[0.15em] mb-2" style={{ color: LAV }}>Thème</p>
            <div className="grid grid-cols-2 gap-2">
              {QUIZ_THEMES.map((t) => {
                const on = theme === t.id;
                return (
                  <button key={t.id} onClick={() => setTheme(t.id)} className="text-left rounded-xl border p-3"
                    style={{ backgroundColor: on ? SURFACE_ALT : SURFACE, borderColor: on ? LAV : BORDER }}>
                    <i className={`fa-solid ${t.icon} text-sm`} style={{ color: on ? LAV_DEEP : LAV_PALE }} />
                    <p className="text-sm font-medium mt-1.5" style={{ color: TEXT }}>{t.label}</p>
                    <p className="text-[10.5px] leading-snug mt-0.5" style={{ color: TEXT_MUTED }}>{t.desc}</p>
                  </button>
                );
              })}
            </div>
          </div>

          <div>
            <p className="text-[11px] uppercase tracking-[0.15em] mb-2" style={{ color: LAV }}>Nombre de questions</p>
            <div className="flex gap-2">
              {[5, 10, 20].map((n) => (
                <button key={n} onClick={() => setCount(n)} className="flex-1 py-2 rounded-lg border text-sm"
                  style={{ backgroundColor: count === n ? SURFACE_ALT : SURFACE, borderColor: count === n ? LAV : BORDER, color: count === n ? LAV_DEEP : TEXT, fontWeight: count === n ? 600 : 400 }}>{n}</button>
              ))}
            </div>
          </div>

          <button disabled={phase === "loading"} onClick={() => start()} className="w-full py-3 rounded-lg text-sm font-medium disabled:opacity-60" style={{ backgroundColor: LAV, color: "#fff" }}>
            {phase === "loading" ? <><i className="fa-solid fa-spinner fa-spin mr-2" />Préparation des questions…</> : <><i className="fa-solid fa-play mr-2" />Commencer</>}
          </button>

          {reviewCount > 0 && (
            <button disabled={phase === "loading"} onClick={() => start("review")} className="w-full rounded-xl p-4 flex items-center gap-3 text-left disabled:opacity-60" style={{ backgroundColor: DANGER + "0F", border: `1px solid ${DANGER}55` }}>
              <i className="fa-solid fa-rotate" style={{ color: DANGER }} />
              <div className="flex-1">
                <p className="text-sm font-medium" style={{ color: TEXT }}>Revoir mes erreurs</p>
                <p className="text-[11px]" style={{ color: TEXT_MUTED }}>{reviewCount} question{reviewCount > 1 ? "s" : ""} à retravailler</p>
              </div>
              <i className="fa-solid fa-chevron-right text-xs" style={{ color: TEXT_MUTED }} />
            </button>
          )}

          <p className="text-[11px] leading-relaxed" style={{ color: TEXT_MUTED }}>
            <i className="fa-solid fa-circle-info mr-1" />Les questions jamais vues et celles que tu as ratées reviennent plus souvent. Chaque réponse indique la référence pour aller relire le passage.
          </p>
        </div>
      </div>
    );
  }

  if (phase === "done") {
    const total = questions.length;
    const ratio = score / total;
    return (
      <div>
        {header}
        <div className="px-5 mt-5 pb-6 space-y-4">
          <div className="rounded-2xl border p-8 text-center" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
            <i className={`fa-solid ${ratio >= 0.8 ? "fa-trophy" : ratio >= 0.5 ? "fa-star" : "fa-seedling"} text-4xl`} style={{ color: ratio >= 0.5 ? GOLD : SAGE }} />
            <p style={{ fontFamily: "'Fraunces', serif" }} className="text-2xl mt-3">{score} / {total}</p>
            <p className="text-sm mt-2" style={{ color: TEXT_MUTED }}>
              {ratio >= 0.8 ? "Excellente connaissance de la Parole !" : ratio >= 0.5 ? "Bien joué, continue comme ça." : "Chaque jour est une occasion d'apprendre."}
            </p>
            <div className="flex gap-2 mt-6">
              <button onClick={() => start(theme)} className="flex-1 py-3 rounded-lg text-sm font-medium" style={{ backgroundColor: LAV, color: "#fff" }}><i className="fa-solid fa-rotate-right mr-2" />Rejouer</button>
              <button onClick={() => setPhase("setup")} className="flex-1 py-3 rounded-lg text-sm border" style={{ borderColor: BORDER, color: TEXT }}>Changer de thème</button>
            </div>
          </div>
          {mistakes.length > 0 && (
            <div className="rounded-2xl border p-4" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
              <p className="text-sm font-semibold mb-3"><i className="fa-solid fa-book-open mr-2" style={{ color: LAV }} />À retenir</p>
              <div className="space-y-3">
                {mistakes.map((m, i) => (
                  <div key={i} className="text-xs leading-relaxed pb-3" style={{ borderBottom: i < mistakes.length - 1 ? `1px solid ${BORDER}` : "none" }}>
                    <p style={{ color: TEXT_MUTED }}>{m.q}</p>
                    {m.quote && <p className="italic mt-1" style={{ color: TEXT_MUTED }}>« {m.quote} »</p>}
                    <p className="mt-1" style={{ color: SAGE, fontWeight: 600 }}><i className="fa-solid fa-check mr-1" />{m.opts[m.ans]}</p>
                    <p className="mt-0.5" style={{ color: LAV_DEEP }}>{m.ref}</p>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  const correct = picked !== null && picked === q.ans;
  return (
    <div>
      {header}
      <div className="px-5 mt-6 pb-6">
        <div className="w-12 h-12 rounded-full mx-auto flex items-center justify-center mb-4" style={{ backgroundColor: GOLD + "22", color: GOLD }}><i className="fa-solid fa-lightbulb" /></div>
        <p className="text-center text-base font-semibold mb-4 px-2">{q.q}</p>
        {q.quote && (
          <div className="rounded-xl p-4 mb-5" style={{ backgroundColor: SURFACE_ALT, border: `1px solid ${BORDER}` }}>
            <p style={{ fontFamily: "'Fraunces', serif" }} className="text-[15px] leading-relaxed text-center">« {q.quote} »</p>
          </div>
        )}
        <div className="space-y-2.5">
          {q.opts.map((opt, i) => {
            let bgc = SURFACE, brd = BORDER;
            if (picked !== null) {
              if (i === q.ans) { bgc = SAGE + "1A"; brd = SAGE; }
              else if (i === picked) { bgc = DANGER + "14"; brd = DANGER; }
            }
            return (
              <button key={i} onClick={() => pick(i)} className="w-full flex items-center gap-3 rounded-xl border px-4 py-3.5 text-left"
                style={{ backgroundColor: bgc, borderColor: brd, color: TEXT }}>
                <span className="w-6 h-6 rounded-full flex items-center justify-center text-[11px] shrink-0 border" style={{ borderColor: brd, color: TEXT_MUTED }}>{"ABCD"[i]}</span>
                <span className="text-sm flex-1">{opt}</span>
                {picked !== null && i === q.ans && <i className="fa-solid fa-circle-check" style={{ color: SAGE }} />}
                {picked !== null && i === picked && i !== q.ans && <i className="fa-solid fa-circle-xmark" style={{ color: DANGER }} />}
              </button>
            );
          })}
        </div>
        {picked !== null && (
          <>
            <div className="mt-4 rounded-xl px-4 py-3 text-xs" style={{ backgroundColor: correct ? SAGE + "14" : DANGER + "0F", color: TEXT }}>
              <p style={{ fontWeight: 600, color: correct ? SAGE : DANGER }}>{correct ? "Bonne réponse !" : `La bonne réponse : ${q.opts[q.ans]}`}</p>
              <p className="mt-1" style={{ color: TEXT_MUTED }}><i className="fa-solid fa-book-bible mr-1" style={{ color: LAV }} />{q.ref}</p>
            </div>
            <button onClick={next} className="w-full mt-4 py-3 rounded-lg text-sm font-medium" style={{ backgroundColor: LAV, color: "#fff" }}>
              {idx + 1 >= questions.length ? "Voir mon score" : <>Question suivante<i className="fa-solid fa-arrow-right ml-2" /></>}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

/* ---------- Mes versets ---------- */

function MyVerses({ saved, onDelete }) {
  return (
    <div>
      <header className="px-5 pb-4" style={{ borderBottom: `1px solid ${BORDER}`, paddingTop: "calc(2rem + env(safe-area-inset-top))" }}>
        <p className="text-xs tracking-[0.2em] uppercase" style={{ color: LAV }}>Favoris</p>
        <h1 style={{ fontFamily: "'Fraunces', serif" }} className="text-2xl mt-1">Mes versets</h1>
        <p className="text-[11px] mt-1" style={{ color: TEXT_MUTED }}>{saved.length} verset{saved.length > 1 ? "s" : ""} gardé{saved.length > 1 ? "s" : ""}</p>
      </header>
      <div className="px-5 mt-4 space-y-3 pb-6">
        {saved.length === 0 ? (
          <div className="text-center py-12 rounded-xl border border-dashed" style={{ borderColor: BORDER }}>
            <p className="text-sm px-6" style={{ color: TEXT_MUTED }}>Garde un verset depuis l'accueil (<i className="fa-regular fa-bookmark" />) pour le retrouver ici quand tu en as besoin.</p>
          </div>
        ) : saved.map((s) => (
          <div key={s.id} className="rounded-2xl border p-4" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
            <div className="flex items-start justify-between gap-3">
              <p style={{ fontFamily: "'Fraunces', serif" }} className="text-[15px] leading-relaxed flex-1">« {s.text} »</p>
              <button onClick={() => onDelete(s.id)} style={{ color: TEXT_MUTED, fontSize: 14 }} className="shrink-0" aria-label="Supprimer"><i className="fa-regular fa-trash-can" /></button>
            </div>
            <p className="text-xs mt-2" style={{ color: LAV_DEEP }}>— {s.reference}</p>
            <p className="text-[10px] mt-1" style={{ color: TEXT_MUTED }}>Gardé le {formatDate(s.saved_at)}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- Shared ---------- */

function Field({ label, children }) {
  return <div className="mb-4"><label className="text-[11px] uppercase tracking-[0.15em] block mb-1.5" style={{ color: LAV }}>{label}</label>{children}</div>;
}
const inputStyle = { backgroundColor: BG, border: `1px solid ${BORDER}`, color: TEXT };
const inputClass = "w-full rounded-lg px-3 py-2.5 text-sm focus:outline-none";

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
</body>
</html>
