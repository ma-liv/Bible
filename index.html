const uid = () => Math.random().toString(36).slice(2, 10);
function todayISO() { return new Date().toISOString().slice(0, 10); }
function dayIndex() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  return Math.floor((now - start) / 86400000);
}
function verseOfDay() { return VERSES[dayIndex() % VERSES.length]; }
function formatDate(d) { if (!d) return ""; return new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }); }
function shuffled(arr) { return [...arr].sort(() => Math.random() - 0.5); }

/* ---------- Auth ---------- */

function Root() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);
  if (session === undefined) {
    return <div style={{ backgroundColor: BG, color: TEXT, minHeight: "100vh", fontFamily: "'IBM Plex Sans', sans-serif" }} className="flex items-center justify-center"><p className="text-sm opacity-70">Connexion…</p></div>;
  }
  if (!session) return <AuthScreen />;
  return <App key={session.user.id} session={session} />;
}

function AuthScreen() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setError(""); setInfo(""); setLoading(true);
    try {
      if (mode === "signup") {
        const { error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        setInfo("Compte créé. Si une confirmation par email est demandée, vérifie ta boîte mail, puis connecte-toi.");
        setMode("signin");
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (e) {
      setError(e.message || "Une erreur est survenue.");
    } finally { setLoading(false); }
  };

  return (
    <div style={{ background: GRADIENT, minHeight: "100vh", fontFamily: "'IBM Plex Sans', sans-serif" }} className="flex flex-col justify-center px-6">
      <div className="max-w-sm w-full mx-auto rounded-2xl p-6" style={{ backgroundColor: SURFACE, border: `1px solid ${BORDER}` }}>
        <p className="text-xs tracking-[0.2em] uppercase mb-2 text-center" style={{ color: LAV }}>✝ Verset du jour</p>
        <h1 style={{ fontFamily: "'Fraunces', serif", color: TEXT }} className="text-2xl text-center mb-6">{mode === "signup" ? "Créer ton compte" : "Bon retour"}</h1>
        <Field label="Email"><input type="email" className={inputClass} style={inputStyle} value={email} onChange={(e) => setEmail(e.target.value)} placeholder="toi@exemple.com" /></Field>
        <Field label="Mot de passe"><input type="password" className={inputClass} style={inputStyle} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" /></Field>
        {error && <p className="text-xs mb-3" style={{ color: DANGER }}>{error}</p>}
        {info && <p className="text-xs mb-3" style={{ color: SAGE }}>{info}</p>}
        <button disabled={loading || !email || !password} onClick={submit} className="w-full py-3 rounded-lg font-medium text-sm disabled:opacity-40 mb-3" style={{ backgroundColor: LAV, color: "#FFFFFF" }}>
          {loading ? "…" : mode === "signup" ? "Créer mon compte" : "Se connecter"}
        </button>
        <button onClick={() => { setMode(mode === "signup" ? "signin" : "signup"); setError(""); setInfo(""); }} className="w-full text-center text-xs" style={{ color: TEXT_MUTED }}>
          {mode === "signup" ? "J'ai déjà un compte" : "Pas encore de compte ? En créer un"}
        </button>
      </div>
    </div>
  );
}

/* ---------- App ---------- */

function App({ session }) {
  const [tab, setTab] = useState("home");
  const [saved, setSaved] = useState([]);
  const [checkins, setCheckins] = useState([]);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState("");
  const [verseIdx, setVerseIdx] = useState(dayIndex() % VERSES.length);

  const fetchAll = async () => {
    const [v, c] = await Promise.all([
      sb.from("saved_verses").select("*").eq("user_id", session.user.id).order("saved_at", { ascending: false }),
      sb.from("daily_checkins").select("*").eq("user_id", session.user.id).order("day", { ascending: false }).limit(60),
    ]);
    if (!v.error) setSaved(v.data || []);
    if (!c.error) setCheckins(c.data || []);
    setReady(true);
  };
  useEffect(() => { fetchAll(); }, [session.user.id]);

  // marque le jour comme actif à l'ouverture
  useEffect(() => {
    (async () => {
      const day = todayISO();
      await sb.from("daily_checkins").upsert({ user_id: session.user.id, day }, { onConflict: "user_id,day", ignoreDuplicates: true });
    })();
  }, [session.user.id]);

  const bumpReadCount = async () => {
    const day = todayISO();
    const existing = checkins.find((c) => c.day === day);
    const n = (existing?.verses_read || 0) + 1;
    const { error } = await sb.from("daily_checkins").upsert({ user_id: session.user.id, day, verses_read: n, quiz_done: existing?.quiz_done || false });
    if (!error) fetchAll();
  };

  const markQuizDone = async () => {
    const day = todayISO();
    const existing = checkins.find((c) => c.day === day);
    await sb.from("daily_checkins").upsert({ user_id: session.user.id, day, verses_read: existing?.verses_read || 0, quiz_done: true });
    fetchAll();
  };

  const saveQuizResult = async (score, total) => {
    const { error } = await sb.from("quiz_results").insert({ user_id: session.user.id, day: todayISO(), score, total });
    if (error) setError(error.message);
    markQuizDone();
  };

  const isSaved = (ref) => saved.some((s) => s.reference === ref);
  const toggleSave = async (verse) => {
    setError("");
    const existing = saved.find((s) => s.reference === verse.ref);
    if (existing) {
      const { error } = await sb.from("saved_verses").delete().eq("id", existing.id);
      if (error) setError(error.message);
    } else {
      const { error } = await sb.from("saved_verses").insert({ user_id: session.user.id, reference: verse.ref, text: verse.text });
      if (error) setError(error.message);
    }
    fetchAll();
  };
  const deleteSaved = async (id) => { const { error } = await sb.from("saved_verses").delete().eq("id", id); if (error) setError(error.message); fetchAll(); };

  // streak = jours consécutifs jusqu'à aujourd'hui
  const streak = useMemo(() => {
    const days = new Set(checkins.map((c) => c.day));
    let n = 0;
    const d = new Date();
    while (days.has(d.toISOString().slice(0, 10))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }, [checkins]);

  const logout = () => sb.auth.signOut();

  if (!ready) {
    return <div style={{ backgroundColor: BG, color: TEXT, minHeight: "100vh", fontFamily: "'IBM Plex Sans', sans-serif" }} className="flex items-center justify-center"><p className="text-sm opacity-70">Chargement…</p></div>;
  }

  return (
    <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", backgroundColor: BG, color: TEXT, minHeight: "100vh", paddingBottom: "calc(84px + env(safe-area-inset-bottom))" }}>
      <main>
        {tab === "home" && (
          <Home
            streak={streak} checkins={checkins}
            verseIdx={verseIdx} setVerseIdx={(i) => { setVerseIdx(i); bumpReadCount(); }}
            isSaved={isSaved} onToggleSave={toggleSave} onLogout={logout} error={error}
          />
        )}
        {tab === "read" && <Reader />}
        {tab === "quiz" && <Quiz onFinish={saveQuizResult} />}
        {tab === "verses" && <MyVerses saved={saved} onDelete={deleteSaved} />}
      </main>

      <nav style={{ position: "fixed", left: 0, right: 0, bottom: 0, backgroundColor: SURFACE, borderTop: `1px solid ${BORDER}`, paddingBottom: "env(safe-area-inset-bottom)" }} className="flex">
        <TabButton active={tab === "home"} onClick={() => setTab("home")} emoji="🏠" label="Accueil" />
        <TabButton active={tab === "read"} onClick={() => setTab("read")} emoji="📖" label="Lire" />
        <TabButton active={tab === "quiz"} onClick={() => setTab("quiz")} emoji="⭐" label="Quiz" />
        <TabButton active={tab === "verses"} onClick={() => setTab("verses")} emoji="🔖" label="Mes versets" />
      </nav>
    </div>
  );
}

function TabButton({ active, onClick, emoji, label }) {
  return (
    <button onClick={onClick} className="flex-1 flex flex-col items-center gap-1 py-3" style={{ color: active ? LAV_DEEP : TEXT_MUTED }}>
      <span style={{ fontSize: 18, opacity: active ? 1 : 0.65 }}>{emoji}</span>
      <span className="text-[9.5px] tracking-wide text-center leading-none" style={{ fontWeight: active ? 600 : 400 }}>{label}</span>
    </button>
  );
}

/* ---------- Accueil : verset du jour + habitudes ---------- */

function Home({ streak, checkins, verseIdx, setVerseIdx, isSaved, onToggleSave, onLogout, error }) {
  const verse = VERSES[verseIdx % VERSES.length];
  const today = new Date();
  // semaine courante L..D
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const weekDays = Array.from({ length: 7 }).map((_, i) => {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const iso = d.toISOString().slice(0, 10);
    return { label: "LMMJVSD"[i], iso, active: checkins.some((c) => c.day === iso), isToday: iso === todayISO() };
  });
  const todayCheck = checkins.find((c) => c.day === todayISO());
  const progress = Math.min(100, ((todayCheck?.verses_read ? 50 : 0) + (todayCheck?.quiz_done ? 50 : 0)));

  const share = async () => {
    const msg = `« ${verse.text} »\n— ${verse.ref}`;
    if (navigator.share) { try { await navigator.share({ text: msg }); } catch (e) {} }
    else { try { await navigator.clipboard.writeText(msg); alert("Verset copié !"); } catch (e) {} }
  };

  return (
    <div>
      {/* Bandeau lavande avec le verset du jour */}
      <div style={{ background: GRADIENT, paddingTop: "calc(2rem + env(safe-area-inset-top))" }} className="px-5 pb-8 rounded-b-3xl">
        <div className="flex items-center justify-between mb-6">
          <div className="flex items-center gap-2">
            <span className="w-9 h-9 rounded-full flex items-center justify-center text-sm" style={{ backgroundColor: "rgba(255,255,255,0.25)", color: "#fff" }}>🔥</span>
            <div>
              <p className="text-[11px]" style={{ color: "rgba(255,255,255,0.8)" }}>Série en cours</p>
              <p className="text-sm font-semibold text-white">{streak} jour{streak > 1 ? "s" : ""}</p>
            </div>
          </div>
          <button onClick={onLogout} className="text-[10px] underline" style={{ color: "rgba(255,255,255,0.8)" }}>Déconnexion</button>
        </div>
        <p className="text-[11px] uppercase tracking-[0.2em] text-center mb-3" style={{ color: "rgba(255,255,255,0.85)" }}>Verset du jour · {verse.theme}</p>
        <p style={{ fontFamily: "'Fraunces', serif" }} className="text-2xl leading-snug text-center text-white px-2">
          {verse.text}
        </p>
        <p className="text-center text-sm mt-4" style={{ color: "rgba(255,255,255,0.9)" }}>— {verse.ref}</p>

        <div className="flex justify-center gap-3 mt-6">
          <button onClick={() => setVerseIdx((verseIdx + VERSES.length - 1) % VERSES.length)} className="w-10 h-10 rounded-full" style={{ backgroundColor: "rgba(255,255,255,0.22)", color: "#fff" }}>‹</button>
          <button onClick={() => onToggleSave(verse)} className="px-4 h-10 rounded-full text-sm font-medium" style={{ backgroundColor: "#FFFFFF", color: LAV_DEEP }}>
            {isSaved(verse.ref) ? "🔖 Enregistré" : "🔖 Garder"}
          </button>
          <button onClick={share} className="px-4 h-10 rounded-full text-sm" style={{ backgroundColor: "rgba(255,255,255,0.22)", color: "#fff" }}>Partager</button>
          <button onClick={() => setVerseIdx((verseIdx + 1) % VERSES.length)} className="w-10 h-10 rounded-full" style={{ backgroundColor: "rgba(255,255,255,0.22)", color: "#fff" }}>›</button>
        </div>
      </div>

      {error && <div className="mx-5 mt-4 text-xs px-3 py-2 rounded" style={{ backgroundColor: DANGER + "1A", border: `1px solid ${DANGER}`, color: TEXT }}>{error}</div>}

      {/* Carte habitudes, comme la capture "Today's Journey" */}
      <div className="px-5 mt-5 space-y-5">
        <div className="rounded-2xl border p-5" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
          <div className="flex items-center justify-between mb-1">
            <p className="text-sm font-semibold">Ton parcours du jour</p>
            <span className="text-xs" style={{ color: GOLD }}>🔥 {streak}</span>
          </div>
          <p className="text-[11px] mb-4" style={{ color: TEXT_MUTED }}>Disciple fidèle</p>
          <div className="flex justify-between mb-4">
            {weekDays.map((d, i) => (
              <div key={i} className="flex flex-col items-center gap-1.5">
                <span className="text-[10px]" style={{ color: TEXT_MUTED }}>{d.label}</span>
                <div className="w-8 h-8 rounded-full flex items-center justify-center text-xs border"
                  style={{
                    backgroundColor: d.active ? (d.isToday ? GOLD + "26" : SURFACE_ALT) : "transparent",
                    borderColor: d.active ? (d.isToday ? GOLD : LAV_PALE) : BORDER,
                  }}>
                  {d.active ? "🔥" : ""}
                </div>
              </div>
            ))}
          </div>
          <div className="flex items-center justify-between text-[11px] mb-1.5">
            <span style={{ color: TEXT_MUTED }}>Progression du jour</span>
            <span style={{ color: GOLD, fontWeight: 600 }}>{progress}%</span>
          </div>
          <div className="h-2 rounded-full overflow-hidden" style={{ backgroundColor: BG }}>
            <div className="h-full rounded-full transition-all" style={{ width: `${progress}%`, backgroundColor: GOLD }} />
          </div>
          <p className="text-[11px] mt-2" style={{ color: TEXT_MUTED }}>Lis un autre verset (50%) et fais le quiz du jour (50%).</p>
        </div>

        <div className="rounded-2xl p-4 flex gap-3" style={{ backgroundColor: SURFACE_ALT, border: `1px solid ${BORDER}` }}>
          <span style={{ fontSize: 18 }}>🙏</span>
          <p className="text-xs leading-relaxed" style={{ color: TEXT }}>
            Prends un instant pour relire le verset lentement, puis une courte prière avec tes propres mots. La régularité compte plus que la durée.
          </p>
        </div>
      </div>
    </div>
  );
}

/* ---------- Lecture de la Bible ---------- */

function Reader() {
  const [book, setBook] = useState(42); // Jean (index 0-based : 42 = Jean)
  const [chapter, setChapter] = useState(1);
  const [verses, setVerses] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const load = async (b = book, ch = chapter) => {
    setLoading(true); setError(""); setVerses(null);
    try {
      const res = await fetch(`https://api.getbible.net/v2/ls1910/${b + 1}/${ch}.json`);
      if (!res.ok) throw new Error("Chapitre introuvable");
      const data = await res.json();
      setVerses(data.verses || []);
    } catch (e) {
      setError("Impossible de charger ce chapitre. Vérifie ta connexion, ou réessaie.");
    } finally { setLoading(false); }
  };
  useEffect(() => { load(); }, []);

  return (
    <div>
      <header className="px-5 pb-4" style={{ borderBottom: `1px solid ${BORDER}`, paddingTop: "calc(2rem + env(safe-area-inset-top))" }}>
        <p className="text-xs tracking-[0.2em] uppercase" style={{ color: LAV }}>Lecture</p>
        <h1 style={{ fontFamily: "'Fraunces', serif" }} className="text-2xl mt-1">La Bible <span className="text-sm font-normal" style={{ color: TEXT_MUTED }}>(Louis Segond 1910)</span></h1>
        <div className="flex gap-2 mt-3">
          <select value={book} onChange={(e) => { const b = Number(e.target.value); setBook(b); setChapter(1); load(b, 1); }} className={inputClass} style={{ ...inputStyle, flex: 2 }}>
            {BOOKS.map((b, i) => <option key={i} value={i}>{b}</option>)}
          </select>
          <input type="number" min="1" value={chapter} onChange={(e) => setChapter(Math.max(1, Number(e.target.value)))} className={inputClass} style={{ ...inputStyle, flex: 1 }} />
          <button onClick={() => load()} className="px-4 rounded-lg text-sm font-medium" style={{ backgroundColor: LAV, color: "#fff" }}>Lire</button>
        </div>
      </header>

      <div className="px-5 mt-4 pb-6">
        {loading && <p className="text-sm text-center py-10" style={{ color: TEXT_MUTED }}>Chargement…</p>}
        {error && <p className="text-sm text-center py-10" style={{ color: DANGER }}>{error}</p>}
        {verses && (
          <div className="rounded-2xl border p-5" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
            <p style={{ fontFamily: "'Fraunces', serif" }} className="text-lg mb-4">{BOOKS[book]} {chapter}</p>
            <div className="space-y-3">
              {verses.map((v) => (
                <p key={v.verse} className="text-[15px] leading-relaxed">
                  <span className="text-xs mr-2" style={{ color: GOLD, fontFamily: "'IBM Plex Mono', monospace" }}>{v.verse}</span>
                  {v.text}
                </p>
              ))}
            </div>
            <div className="flex justify-between mt-6">
              <button disabled={chapter <= 1} onClick={() => { const c = chapter - 1; setChapter(c); load(book, c); }} className="text-sm px-4 py-2 rounded-lg border disabled:opacity-30" style={{ borderColor: BORDER, color: TEXT }}>‹ Précédent</button>
              <button onClick={() => { const c = chapter + 1; setChapter(c); load(book, c); }} className="text-sm px-4 py-2 rounded-lg" style={{ backgroundColor: LAV, color: "#fff" }}>Suivant ›</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- Quiz ---------- */

function Quiz({ onFinish }) {
  const [questions, setQuestions] = useState(() => shuffled(QUIZ_BANK).slice(0, 10));
  const [idx, setIdx] = useState(0);
  const [score, setScore] = useState(0);
  const [picked, setPicked] = useState(null);
  const [done, setDone] = useState(false);
  const q = questions[idx];

  const pick = (i) => {
    if (picked !== null) return;
    setPicked(i);
    if (i === q.ans) setScore((s) => s + 1);
  };
  const next = () => {
    if (idx + 1 >= questions.length) {
      setDone(true);
      onFinish(score, questions.length);
    } else { setIdx(idx + 1); setPicked(null); }
  };
  const restart = () => { setQuestions(shuffled(QUIZ_BANK).slice(0, 10)); setIdx(0); setScore(0); setPicked(null); setDone(false); };

  if (done) {
    return (
      <div className="px-5" style={{ paddingTop: "calc(3rem + env(safe-area-inset-top))" }}>
        <div className="rounded-2xl border p-8 text-center" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
          <p style={{ fontSize: 40 }}>{score >= 8 ? "🌟" : score >= 5 ? "✨" : "🙏"}</p>
          <p style={{ fontFamily: "'Fraunces', serif" }} className="text-2xl mt-2">{score} / {questions.length}</p>
          <p className="text-sm mt-2" style={{ color: TEXT_MUTED }}>
            {score >= 8 ? "Excellente connaissance de la Parole !" : score >= 5 ? "Bien joué, continue comme ça." : "Chaque jour est une occasion d'apprendre."}
          </p>
          <button onClick={restart} className="mt-6 px-6 py-3 rounded-lg text-sm font-medium" style={{ backgroundColor: LAV, color: "#fff" }}>Rejouer</button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <header className="px-5 pb-4" style={{ borderBottom: `1px solid ${BORDER}`, paddingTop: "calc(2rem + env(safe-area-inset-top))" }}>
        <div className="flex items-center justify-between">
          <p className="text-xs tracking-[0.2em] uppercase" style={{ color: LAV }}>Quiz biblique</p>
          <p className="text-xs" style={{ color: GOLD }}>⭐ {score}</p>
        </div>
        <p className="text-[11px] mt-2" style={{ color: TEXT_MUTED }}>Question {idx + 1}/{questions.length}</p>
        <div className="h-1.5 rounded-full overflow-hidden mt-2" style={{ backgroundColor: SURFACE_ALT }}>
          <div className="h-full rounded-full transition-all" style={{ width: `${((idx) / questions.length) * 100}%`, backgroundColor: GOLD }} />
        </div>
      </header>

      <div className="px-5 mt-6">
        <div className="w-12 h-12 rounded-full mx-auto flex items-center justify-center mb-4" style={{ backgroundColor: GOLD + "22" }}>💡</div>
        <p className="text-center text-base font-semibold mb-6 px-2">{q.q}</p>
        <div className="space-y-2.5">
          {q.opts.map((opt, i) => {
            let bgc = SURFACE, brd = BORDER, txt = TEXT;
            if (picked !== null) {
              if (i === q.ans) { bgc = SAGE + "1A"; brd = SAGE; }
              else if (i === picked) { bgc = DANGER + "14"; brd = DANGER; }
            }
            return (
              <button key={i} onClick={() => pick(i)} className="w-full flex items-center gap-3 rounded-xl border px-4 py-3.5 text-left"
                style={{ backgroundColor: bgc, borderColor: brd, color: txt }}>
                <span className="w-6 h-6 rounded-full flex items-center justify-center text-[11px] shrink-0 border" style={{ borderColor: brd, color: TEXT_MUTED }}>{"ABCD"[i]}</span>
                <span className="text-sm">{opt}</span>
              </button>
            );
          })}
        </div>
        {picked !== null && (
          <button onClick={next} className="w-full mt-5 py-3 rounded-lg text-sm font-medium" style={{ backgroundColor: LAV, color: "#fff" }}>
            {idx + 1 >= questions.length ? "Voir mon score" : "Question suivante →"}
          </button>
        )}
      </div>
    </div>
  );
}

/* ---------- Mes versets ---------- */

function MyVerses({ saved, onDelete }) {
  return (
    <div>
      <header className="px-5 pb-4" style={{ borderBottom: `1px solid ${BORDER}`, paddingTop: "calc(2rem + env(safe-area-inset-top))" }}>
        <p className="text-xs tracking-[0.2em] uppercase" style={{ color: LAV }}>Favoris</p>
        <h1 style={{ fontFamily: "'Fraunces', serif" }} className="text-2xl mt-1">Mes versets</h1>
        <p className="text-[11px] mt-1" style={{ color: TEXT_MUTED }}>{saved.length} verset{saved.length > 1 ? "s" : ""} gardé{saved.length > 1 ? "s" : ""}</p>
      </header>
      <div className="px-5 mt-4 space-y-3 pb-6">
        {saved.length === 0 ? (
          <div className="text-center py-12 rounded-xl border border-dashed" style={{ borderColor: BORDER }}>
            <p className="text-sm px-6" style={{ color: TEXT_MUTED }}>Garde un verset depuis l'accueil (🔖) pour le retrouver ici quand tu en as besoin.</p>
          </div>
        ) : saved.map((s) => (
          <div key={s.id} className="rounded-2xl border p-4" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
            <div className="flex items-start justify-between gap-3">
              <p style={{ fontFamily: "'Fraunces', serif" }} className="text-[15px] leading-relaxed flex-1">« {s.text} »</p>
              <button onClick={() => onDelete(s.id)} style={{ color: TEXT_MUTED, fontSize: 14 }} className="shrink-0">🗑️</button>
            </div>
            <p className="text-xs mt-2" style={{ color: LAV_DEEP }}>— {s.reference}</p>
            <p className="text-[10px] mt-1" style={{ color: TEXT_MUTED }}>Gardé le {formatDate(s.saved_at)}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- Shared ---------- */

function Field({ label, children }) {
  return <div className="mb-4"><label className="text-[11px] uppercase tracking-[0.15em] block mb-1.5" style={{ color: LAV }}>{label}</label>{children}</div>;
}
const inputStyle = { backgroundColor: BG, border: `1px solid ${BORDER}`, color: TEXT };
const inputClass = "w-full rounded-lg px-3 py-2.5 text-sm focus:outline-none";

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
